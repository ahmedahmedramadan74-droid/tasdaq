<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخيص الصور</title>
<style>body{font:16px/1.7 system-ui,Arial,sans-serif;background:#0f1115;color:#e8e8e8;margin:0;padding:18px;max-width:760px;margin-inline:auto}
h1{font-size:20px}.box{background:#181b22;border:1px solid #2a2f3a;border-radius:12px;padding:12px 14px;margin:12px 0}
.ok{color:#5ee08a}.bad{color:#ff7b7b}.warn{color:#ffc857}code{background:#232834;padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed;word-break:break-all}
.verdict{font-size:17px;border-width:2px}details{margin-top:6px}li{word-break:break-all;direction:ltr;text-align:left}</style></head><body>
<h1>تشخيص الصور على الاستضافة</h1>
<div class="box">عنوان الصفحة الحالي: <code id="where"></code><br>مجلد الموقع الذي تُحسب منه المسارات: <code id="base"></code></div>
<div class="box verdict" id="verdict">جارٍ الفحص…</div>
<div id="groups"></div>
<script>
const CORE=["images/frame1-cover.svg", "images/frame1-hero.svg", "images/frame2-cover.svg", "images/frame2-hero.svg", "images/gallery1-1.svg", "images/gallery1-2.svg", "images/gallery1-3.svg", "images/gallery1-4.svg", "images/gallery1-5.svg", "images/gallery1-6.svg", "images/gallery2-1.svg", "images/gallery2-2.svg", "images/gallery2-3.svg", "images/gallery2-4.svg", "images/gallery2-5.svg", "images/gallery2-6.svg", "images/gaza.jpg", "images/home-circle.svg", "images/main-hero.svg", "images/muqata3a-logo.jpg", "images/p3-boycott-hero.svg", "images/page3-hero.jpg"], PROD=["images/products/ace.jpg", "images/products/aero.jpg", "images/products/ahava.jpg", "images/products/ajax.jpg", "images/products/always.jpg", "images/products/ariel.jpg", "images/products/aussie.jpg", "images/products/axe.jpg", "images/products/ben-jerrys.jpg", "images/products/bold.jpg", "images/products/bounce.jpg", "images/products/bounty.jpg", "images/products/burger-king.jpg", "images/products/carrefour.jpg", "images/products/cascade.jpg", "images/products/cerave.jpg", "images/products/cerelac.jpg", "images/products/cheer.jpg", "images/products/cif.jpg", "images/products/clear.jpg", "images/products/closeup.jpg", "images/products/coca-cola.jpg", "images/products/coconut-milk.jpg", "images/products/colgate.jpg", "images/products/comfort.jpg", "images/products/costa-coffee.jpg", "images/products/crest.jpg", "images/products/dasani.jpg", "images/products/dates-carmel.jpg", "images/products/dates-hadiklaim.jpg", "images/products/dates-mehadrin.jpg", "images/products/dawn.jpg", "images/products/degree.jpg", "images/products/domestos.jpg", "images/products/dominos.jpg", "images/products/dove.jpg", "images/products/downy.jpg", "images/products/drano.jpg", "images/products/dreft.jpg", "images/products/duck.jpg", "images/products/ecover.jpg", "images/products/elmex.jpg", "images/products/era.jpg", "images/products/fabuloso.jpg", "images/products/fairy.jpg", "images/products/fanta.jpg", "images/products/fantastik.jpg", "images/products/febreze.jpg", "images/products/flash.jpg", "images/products/fresca.jpg", "images/products/fuze-tea.jpg", "images/products/gain.jpg", "images/products/garnier.jpg", "images/products/gillette.jpg", "images/products/glade.jpg", "images/products/head-shoulders.jpg", "images/products/hellmanns.jpg", "images/products/herbal-essences.jpg", "images/products/innocent.jpg", "images/products/israeli-produce.jpg", "images/products/ivory.jpg", "images/products/joy.jpg", "images/products/kelloggs.jpg", "images/products/kerastase.jpg", "images/products/kiehls.jpg", "images/products/kitkat.jpg", "images/products/knorr.jpg", "images/products/la-roche-posay.jpg", "images/products/lancome.jpg", "images/products/lenor.jpg", "images/products/lifebuoy.jpg", "images/products/loreal.jpg", "images/products/love-home-and-planet.jpg", "images/products/lux.jpg", "images/products/maggi.jpg", "images/products/magnum.jpg", "images/products/matrix.jpg", "images/products/maybelline.jpg", "images/products/mcdonalds.jpg", "images/products/method.jpg", "images/products/milo.jpg", "images/products/minute-maid.jpg", "images/products/mr-clean.jpg", "images/products/mr-muscle.jpg", "images/products/mr-sheen.jpg", "images/products/murphy-oil-soap.jpg", "images/products/nescafe.jpg", "images/products/nespresso.jpg", "images/products/nesquik.jpg", "images/products/nestle-formula.jpg", "images/products/nestle-water.jpg", "images/products/nexxus.jpg", "images/products/nido.jpg", "images/products/nyx.jpg", "images/products/olay.jpg", "images/products/old-spice.jpg", "images/products/omo.jpg", "images/products/oral-b.jpg", "images/products/oreo.jpg", "images/products/oust.jpg", "images/products/palmolive.jpg", "images/products/pampers.jpg", "images/products/pantene.jpg", "images/products/papa-johns.jpg", "images/products/perrier.jpg", "images/products/pizza-hut.jpg", "images/products/pledge.jpg", "images/products/ponds.jpg", "images/products/pot-noodle.jpg", "images/products/powerade.jpg", "images/products/protex.jpg", "images/products/quality-street.jpg", "images/products/radion.jpg", "images/products/redken.jpg", "images/products/rexona.jpg", "images/products/ritz.jpg", "images/products/sabra-hummus.jpg", "images/products/san-pellegrino.jpg", "images/products/sanex.jpg", "images/products/schweppes.jpg", "images/products/scrubbing-bubbles.jpg", "images/products/secret.jpg", "images/products/seventh-generation.jpg", "images/products/shout.jpg", "images/products/siemens.jpg", "images/products/simple.jpg", "images/products/sk-ii.jpg", "images/products/skip.jpg", "images/products/smarties.jpg", "images/products/smartwater.jpg", "images/products/sodastream.jpg", "images/products/softsoap.jpg", "images/products/soupline.jpg", "images/products/speed-stick.jpg", "images/products/sprite.jpg", "images/products/starbucks.jpg", "images/products/sunlight.jpg", "images/products/sunsilk.jpg", "images/products/surf.jpg", "images/products/swiffer.jpg", "images/products/tampax.jpg", "images/products/tide.jpg", "images/products/tresemme.jpg", "images/products/urban-decay.jpg", "images/products/vaseline.jpg", "images/products/venus.jpg", "images/products/vichy.jpg", "images/products/vim.jpg", "images/products/vitaminwater.jpg", "images/products/windex.jpg"], AV=["images/avatars/default.svg"];
</script>
<script src="data/photos-external.js"></script>
<script>
const $=s=>document.querySelector(s);
$("#where").textContent=location.href; $("#base").textContent=new URL("./",location.href).href;
const load=u=>new Promise(r=>{const i=new Image();i.referrerPolicy="no-referrer";i.onload=()=>r(true);i.onerror=()=>r(false);i.src=u+(u.startsWith("http")?"":"?t="+Date.now())});
async function test(list,abs){const bad=[];let ok=0,k=0;const q=list.slice();
  await Promise.all(Array.from({length:8},async()=>{while(q.length){const u=q.shift();const good=await load(abs?u:new URL(u,location.href).href);good?ok++:bad.push(u)}}));return{ok,bad,n:list.length}}
function row(title,res,note){const pct=res.n?Math.round(res.ok/res.n*100):0;const c=pct===100?"ok":pct===0?"bad":"warn";
  $("#groups").insertAdjacentHTML("beforeend",`<div class="box"><b>${title}</b>: <span class="${c}">${res.ok} من ${res.n} (${pct}%)</span>${note?"<br><small>"+note+"</small>":""}${res.bad.length?`<details><summary>الملفات التي لم تُحمَّل (${res.bad.length})</summary><ul>${res.bad.slice(0,60).map(x=>"<li>"+x+"</li>").join("")}</ul></details>`:""}</div>`);return pct}
(async()=>{
  const ext=[...new Set(JSON.stringify(typeof PHOTO_EXTERNAL!=="undefined"?PHOTO_EXTERNAL:{}).match(/https:\/\/[^"\s]+/g)||[])].filter(u=>!/\/\/(www\.)?(commons\.wikimedia|upload\.wikimedia)/.test("")||true).slice(0,40);
  const c=await test(CORE),p=await test(PROD),a=await test(AV),e=ext.length?await test(ext,true):{ok:0,bad:[],n:0};
  const pc=row("صور الموقع الأساسية (images/)",c),pp=row("صور المنتجات المحلية (images/products/)",p),pa=row("الأفاتار (images/avatars/)",a);
  e.n&&row("روابط الصور الخارجية (عيّنة 40)",e,"إن فشلت هذه وحدها فالمشكلة من الموقع المصدر نفسه (يمنع الربط المباشر) وليست من الرفع.");
  let v;
  if(pc===0&&pp===0&&pa===0) v='<span class="bad">مجلد <code>images</code> لم يصل إلى الاستضافة إطلاقًا</span> (أو وُضع في مكان غير الذي فيه <code>index.html</code>). افتح مستودعك على GitHub وتأكد أن <code>images</code> بجانب <code>index.html</code> مباشرة وليس داخل مجلد آخر.';
  else if(pc===100&&pp<100&&pp>=0) v='<span class="warn">الرفع ناقص:</span> الصور الأساسية وصلت لكن صور المنتجات وصلت جزئيًا ('+p.ok+' من '+p.n+'). رفع GitHub من المتصفح يقبل 100 ملف فقط في المرة، فارفع <code>images/products</code> على دفعات أو استخدم GitHub Desktop/‏git.';
  else if(pc<100) v='<span class="warn">بعض صور الموقع الأساسية لم تصل</span> — راجع القائمة أدناه؛ غالبًا ملفات لم تُرفع أو اختلاف في حالة الأحرف.';
  else v='<span class="ok">كل الصور المحلية وصلت سليمة.</span> إن كانت صور المنتجات لا تظهر في الموقع فالسبب أنها تعتمد على روابط خارجية أو أنها مخفية عمدًا (<code>SHOW_LOCAL_SAMPLES=false</code>) وليس على الرفع.';
  $("#verdict").innerHTML=v;
})();
</script></body></html>
